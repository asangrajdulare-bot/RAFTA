<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFTA ADMIN QR ACTIVATE</title><script src="https://unpkg.com/html5-qrcode"></script>
<style>body{background:#f5f7fb;font-family:system-ui}.header{background:#0b1220;color:#fff;padding:14px;display:flex;justify-content:space-between}
.logo{width:36px;height:36px;background:#ffcc00;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.card{background:#fff;margin:12px;border-radius:16px;padding:16px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.btn{width:100%;padding:12px;background:#111;color:#fff;border-radius:10px;border:none;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee}
#login{position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:99}
.loginBox{background:#fff;padding:24px;border-radius:20px;width:90%;max-width:360px;text-align:center}
</style></head><body>
<div id="login"><div class="loginBox"><div style="display:flex;justify-content:space-between"><div class="logo">R</div><b>RAFTA</b></div>
<h1 style="font-size:32px;font-weight:900;margin:12px 0">RAFTA</h1><p>RAFTA ADMIN QR ACTIVATE</p>
<input id="uid" class="input" placeholder="User ID"><input id="pwd" type="password" class="input" placeholder="Password">
<button class="btn" onclick="if(uid.value=='RAFTAADMIN'&&pwd.value==localStorage.getItem('rafta_pwd')||'RAFTA@2026'){login.style.display='none'}else alert('Wrong')">LOGIN</button>
<p style="font-size:11px;color:#888;margin-top:8px">ID: RAFTAADMIN | Pass: RAFTA@2026</p></div></div>
<div class="header"><div style="display:flex;gap:8px;align-items:center"><div class="logo">R</div><div><b>RAFTA QR ADMIN</b><br><small style="opacity:.7">Dynamic QR Activator</small></div></div>
<div onclick="login.style.display='flex'">Logout</div></div>
<div class="card"><h3>Activate New QR</h3><div style="display:flex;gap:6px"><input id="qr" class="input" placeholder="RAFTA001"><button class="btn" style="width:80px" onclick="new Html5Qrcode('reader').start({facingMode:'environment'},{fps:10,qrbox:250},t=>{qr.value=t.split('qr=')[1]||t;reader.innerHTML=''})">SCAN</button></div>
<div id="reader"></div><input id="car" class="input" placeholder="Car Number"><input id="wa" class="input" placeholder="WhatsApp +91">
<button class="btn" onclick="let db=JSON.parse(localStorage.getItem('rafta_db')||'{}');db[qr.value.toUpperCase()]={car:car.value,wa:wa.value,time:new Date().toLocaleString()};localStorage.setItem('rafta_db',JSON.stringify(db));alert(qr.value+' Activated');location.reload()">ACTIVATE</button>
<p style="font-size:11px;color:#888">Same ID se dobara Active = Naya QR Replace</p></div>
<div class="card"><h3>Activated QRs</h3><div id="list"></div></div>
<script>let db=JSON.parse(localStorage.getItem('rafta_db')||'{}');let l=document.getElementById('list');Object.keys(db).forEach(k=>{l.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><b>${k}</b><span>${db[k].car}</span></div>`})</script>
</body></html>
