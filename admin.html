<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFTA ADMIN</title><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#faf7f2;display:flex;justify-content:center}.phone{max-width:420px;width:100%;background:#faf7f2;min-height:100vh;padding-bottom:90px}.header{background:#0c0c0c;color:#FFC600;padding:22px;border-radius:0 0 24px 24px}.stats{display:flex;gap:10px;padding:15px;margin-top:-18px}.sbox{flex:1;background:#fdf0e1;border-radius:16px;padding:12px}.sbox b{font-size:12px;color:#555}.sbox strong{font-size:22px;display:block}.card{background:#fff;border-radius:20px;margin:10px 15px;padding:18px}.card h2{text-align:center;margin:0 0 10px}input{width:100%;padding:12px;margin:8px 0 14px;border-radius:10px;border:1.5px solid #ddd}.btn{width:100%;background:#FFC600;border:none;padding:14px;border-radius:12px;font-weight:800}.qr{background:#fff;border-radius:14px;margin:0 15px 10px;padding:12px;display:flex;gap:10px}</style></head><body><div class="phone"><div class="header"><h1>RAFTA QR ADMIN -<br>Dynamic QR Activator</h1><p>📍 Bihar • QR Activation Platform</p></div><div class="stats"><div class="sbox"><b>Total Activated</b><strong id="t1">0 QRs</strong></div><div class="sbox"><b>Today</b><strong id="t2">+0</strong></div></div><div class="card"><h2>Activate New QR</h2>QR ID<input id="qr" placeholder="RAFTA001">Car Number<input id="car" placeholder="BR01AB1234">WhatsApp Number<input id="ph" placeholder="9876543210"><button class="btn" onclick="activate()">⚡ ACTIVATE</button><div id="res"></div></div><div id="list"></div></div><script>let db=JSON.parse(localStorage.getItem('rafta')||'{}');function activate(){let q=document.getElementById('qr').value.toUpperCase().trim(),c=document.getElementById('car').value.trim(),p=document.getElementById('ph').value.replace(/[^0-9]/g,'').slice(-10);if(!q||!c||!p){alert('Sab bharo bhai');return;}let wa=`https://wa.me/91${p}?text=Namaste! Gaadi ${encodeURIComponent(c)} (${q}) galat park hai. - RAFTA`;let qrImg=`https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(wa)}`;db[q]={car:c,phone:p,wa:wa,img:qrImg,time:new Date().toLocaleTimeString()};localStorage.setItem('rafta',JSON.stringify(db));document.getElementById('res').innerHTML=`<div style="text-align:center;margin-top:15px"><b>✅ ${q} ACTIVE</b><br><img src="${qrImg}" width="200" style="margin:10px;border:3px solid #000;border-radius:12px"><br><a href="${qrImg}" download="${q}.png"><button class="btn" style="background:#000;color:#FFC600">📥 QR DOWNLOAD KARO</button></a></div>`;render();}function render(){let k=Object.keys(db).reverse();document.getElementById('t1').innerText=k.length+' QRs';document.getElementById('t2').innerText='+'+k.length+' Activated';let h='';k.forEach(id=>{let d=db[id];h+=`<div class=qr><div style="width:30px;height:30px;background:#22c55e;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center">✓</div><div><b>QR ID ${id}</b><br><small>Car: ${d.car} • +91 ${d.phone}</small></div></div>`});document.getElementById('list').innerHTML=h;}render();</script></body></html>
