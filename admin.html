<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFTA AGENT</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#faf7f2;display:flex;justify-content:center}.phone{max-width:430px;width:100%;min-height:100vh;background:#faf7f2}.header{background:#0c0c0c;color:#FFC600;padding:20px;border-radius:0 0 24px 24px}.stats{display:flex;gap:10px;padding:15px;margin-top:-18px}.sbox{flex:1;background:#fdf0e1;border-radius:16px;padding:12px}.sbox strong{font-size:20px;display:block}.card{background:#fff;border-radius:20px;margin:12px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.06)}label{font-size:11px;font-weight:800;color:#555;display:block;margin-top:12px}input{width:100%;padding:12px;margin:4px 0 8px;border-radius:10px;border:1.5px solid #ddd}.btn{width:100%;background:#FFC600;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}.btn2{background:#000;color:#FFC600}#reader{width:100%;border-radius:12px;overflow:hidden;margin-top:10px;display:none}.qr{background:#fff;border-radius:14px;margin:8px 12px;padding:12px;display:flex;justify-content:space-between;align-items:center}</style></head><body><div class="phone"><div class="header"><h1>RAFTA AGENT APP</h1><p>Google Pay Jaisa Activation</p></div><div class="stats"><div class="sbox"><b>Total Activated</b><strong id="t1">0 QRs</strong></div><div class="sbox"><b>Today</b><strong id="t2">0</strong></div></div><div class="card"><h2 style="text-align:center;margin:0">📷 QR Scan Karke Activate Karo</h2><button class="btn btn2" onclick="startScan()" id="scanBtn">📷 SCAN QR - CAMERA KHOLO</button><div id="reader"></div><div id="scanOk" style="text-align:center;color:green;font-weight:bold;margin-top:8px"></div><label>QR ID *</label><input id="qr" placeholder="Scan se auto ayega"><label>Vehicle No *</label><input id="vehicle" placeholder="BR01AB1234"><label>Mobile No *</label><input id="mobile" placeholder="9876543210"><label>Kaam Kya Karte Hai *</label><input id="work" placeholder="Doctor / Business / Teacher"><label>WhatsApp No *</label><input id="wano" placeholder="Jispe msg jayega"><button class="btn" onclick="activate()">⚡ ACTIVATE KARO</button><div id="res"></div></div><div style="padding:10px 15px"><b>Activated List:</b></div><div id="list"></div></div><script>let db=JSON.parse(localStorage.getItem('rafta_final')||'{}');let qrScanner;function startScan(){let r=document.getElementById('reader');r.style.display='block';qrScanner=new Html5Qrcode("reader");qrScanner.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{let id=txt;try{let u=new URL(txt);id=u.searchParams.get('qr')||u.searchParams.get('id')||txt}catch{}id=(id.match(/RAFTA\d+/i)?.[0]||id).toUpperCase().trim();qr.value=id;scanOk.innerText="✅ SCAN HO GAYA: "+id;qrScanner.stop();r.style.display='none';},()=>{}).catch(e=>alert("Camera error: "+e))}function activate(){let q=qr.value.toUpperCase().trim(),v=vehicle.value.trim(),m=mobile.value.replace(/\D/g,'').slice(-10),wk=work.value.trim(),wa=wano.value.replace(/\D/g,'').slice(-10);if(!q||!v||!m||!wk||!wa)return alert("5 field bharo bhai");let waLink=`https://wa.me/91${wa}?text=Namaste! Aapki Gaadi ${encodeURIComponent(v)} (${q}) parking issue hai. Owner Mob: ${m} (${wk}) - RAFTA`;db[q]={vehicle:v,mobile:m,work:wk,whatsapp:wa,waLink:waLink,time:Date.now(),date:new Date().toLocaleDateString()};localStorage.setItem('rafta_final',JSON.stringify(db));localStorage.setItem('rafta',JSON.stringify(db));localStorage.setItem('rafta_v3',JSON.stringify(db));res.innerHTML=`<div style="background:#d1fae5;padding:12px;border-radius:12px;margin-top:12px;text-align:center"><b>✅ ${q} LIVE HO GAYA!</b><br><small>${v} | ${m} | ${wk}</small><br><a href="index.html?qr=${q}" target="_blank" style="background:#000;color:#FFC600;padding:6px 12px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:8px">TEST SCAN</a></div>`;render()}function render(){let k=Object.keys(db).reverse();t1.innerText=k.length+" QRs";t2.innerText=k.length;let h="";k.forEach(id=>{let d=db[id];h+=`<div class=qr><div><b>${id}</b> - ${d.vehicle}<br><small>📱${d.mobile} | 💼${d.work} | 💬${d.whatsapp}</small></div><button onclick="delete db['${id}'];localStorage.setItem('rafta_final',JSON.stringify(db));localStorage.setItem('rafta',JSON.stringify(db));render()" style="background:#fee2e2;border:none;padding:6px 8px;border-radius:8px">🗑️</button></div>`});list.innerHTML=h||'<p style="text-align:center;color:#888">Koi QR active nahi</p>'}render()</script></body></html>
