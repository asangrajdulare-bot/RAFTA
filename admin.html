<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFTA - Vehicle Contact</title><style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#0f0f0f;display:flex;justify-content:center}.phone{max-width:420px;width:100%;background:#f6f5ef;min-height:100vh}.top{background:#000;color:#FFC600;padding:20px;text-align:center;border-radius:0 0 20px 20px}.card{background:#fff;border-radius:20px;margin:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.1)}.badge{background:#FFC600;color:#000;padding:5px 12px;border-radius:20px;font-weight:900;font-size:12px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}.btn{width:100%;padding:16px;border-radius:14px;font-weight:900;font-size:16px;margin-top:12px;display:flex;justify-content:center;text-decoration:none}.btn-call{background:#000;color:#fff}.btn-wa{background:#25D366;color:#fff}</style></head><body><div class="phone"><div class="top"><h2 style="margin:0;letter-spacing:1px">RAFTA</h2><small style="color:#aaa">Safe Parking - Bihar</small></div><div class="card" id="main">⏳ Loading RAFTA details...</div></div><script>
async function load(){
let q=new URLSearchParams(location.search).get('qr');q=(q||'').toUpperCase().trim();if(!q){main.innerHTML="<h3>QR ID nahi mila</h3>";return}
try{let res=await fetch('data.json?v='+Date.now());let db=await res.json();let d=db[q];
if(!d){main.innerHTML=`<div style="text-align:center;padding:20px"><span class="badge">${q}</span><h2>QR Not Activated Yet</h2><p style="color:#666">Ye QR ID abhi admin ne activate nahi kiya</p><small>Admin: admin.html pe ${q} ko active karo</small></div>`;return}
let waMsg=`Namaste ${d.owner} Ji! Aapki Gaadi ${d.vehicle} (${q}) parking me hai, kripya hataye - RAFTA`;
let waLink=`https://wa.me/91${d.whatsapp}?text=${encodeURIComponent(waMsg)}`;let callLink=`tel:+91${d.mobile}`;
main.innerHTML=`<div style="text-align:center"><span class="badge">LIVE • ${q}</span><h2 style="margin:12px 0 4px">${d.vehicle}</h2><p style="margin:0;color:#555">Owner: <b>${d.owner}</b> • ${d.profession}</p></div><div style="margin-top:18px"><div class="row"><span>Vehicle No</span><b>${d.vehicle}</b></div><div class="row"><span>Owner Name</span><b>${d.owner}</b></div><div class="row"><span>Profession</span><b>${d.profession}</b></div><div class="row"><span>Status</span><b style="color:green">● Verified</b></div></div><a class="btn btn-call" href="${callLink}">📞 CALL NOW</a><small style="display:block;text-align:center;color:#888;margin-top:4px">Number hidden - click pe call lagega</small><a class="btn btn-wa" href="${waLink}" target="_blank">💬 WHATSAPP MESSAGE</a><small style="display:block;text-align:center;color:#888;margin-top:4px">Direct WhatsApp chat khulega</small><div style="background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:12px;margin-top:16px;font-size:13px">🚗 Gaadi galat jagah park hai toh upar ke buttons se contact karo, polite rahe.</div>`;
}catch(e){main.innerHTML="Error loading data.json: "+e.message}}
load();
</script></body></html>
