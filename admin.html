<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFTA SCANNER</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#000;display:flex;justify-content:center}
.phone{max-width:420px;width:100%;background:#f5f5f0;min-height:100vh}
.header{background:#0a0a0a;color:#FFC600;padding:20px;text-align:center}
#reader{width:100%;height:380px;background:#000;position:relative}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
.card{background:#fff;border-radius:20px;margin:-20px 14px 14px;padding:18px;position:relative;z-index:2}
input,select{width:100%;padding:12px;margin:5px 0 8px;border-radius:10px;border:1.5px solid #ddd}
label{font-size:11px;font-weight:800;display:block;margin-top:8px}
.btn{width:100%;background:#FFC600;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:10px}
.btn-scan{background:#000;color:#FFC600;font-size:16px;padding:16px}
.scan-line{position:absolute;top:50%;left:10%;right:10%;height:3px;background:#FFC600;box-shadow:0 0 10px #FFC600;animation:scan 2s infinite;z-index:5}
@keyframes scan{0%{top:20%}50%{top:80%}100%{top:20%}}
.corners{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.corner{position:absolute;width:40px;height:40px;border:4px solid #FFC600}
.c1{top:15%;left:10%;border-right:0;border-bottom:0}
.c2{top:15%;right:10%;border-left:0;border-bottom:0}
.c3{bottom:15%;left:10%;border-right:0;border-top:0}
.c4{bottom:15%;right:10%;border-left:0;border-top:0}
</style></head><body>
<div class="phone">
<div class="header"><h2 style="margin:0">RAFTA QR SCANNER</h2><small>Google Pay jaisa fast scan</small></div>

<div id="reader">
<div class="scan-line"></div>
<div class="corners"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div></div>
</div>

<div style="background:#000;color:#fff;text-align:center;padding:8px;font-size:12px" id="status">📷 Camera ready hai... QR ko beech me lao</div>

<div class="card">
<label>QR ID * Auto Scan Hoga</label><input id="qr" placeholder="Scan hote hi yaha ayega" style="background:#fffde7;font-weight:bold;border:2px solid #FFC600">
<label>Vehicle No *</label><input id="vehicle" placeholder="BR01AB1234">
<label>Mobile No *</label><input id="mobile" placeholder="9876543210" type="tel">
<label>Kaam *</label><select id="work"><option value="">Select Karo</option><option>Agent</option><option>Doctor</option><option>Business</option><option>Teacher</option><option>Driver</option><option>Other</option></select>
<label>WhatsApp No *</label><input id="wano" placeholder="9876543210" type="tel">
<button class="btn" onclick="activate()">⚡ ACTIVATE KARO</button>
<div id="res"></div>
</div>
<div id="list"></div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('rafta_final')||'{}');
let html5QrCode;
let lastScan="";

function onScanSuccess(decodedText, decodedResult) {
    if(decodedText===lastScan) return;
    lastScan=decodedText;
    console.log("SCAN:",decodedText);

    // QR se ID nikalo
    let id=decodedText;
    try{
        let url=new URL(decodedText);
        id=url.searchParams.get('qr')||url.searchParams.get('id')||decodedText;
    }catch(e){}
    // RAFTA pattern nikalo
    let m=id.toString().match(/RAFTA[0-9]+|Br[0-9]+|[A-Z0-9]{4,}/i);
    if(m) id=m[0].toUpperCase();
    id=id.trim().substring(0,20);

    document.getElementById('qr').value=id;
    document.getElementById('status').innerHTML="✅ SCAN HO GAYA: "+id+" - Neeche details bharo";
    document.getElementById('status').style.background="#22c55e";

    // Vibrate
    if(navigator.vibrate) navigator.vibrate(200);

    // Beep sound
    let audio=new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZQAAABkY29tZ2NvbW1lbnQ=');
    audio.play().catch(()=>{});
}

function startScanner(){
    html5QrCode=new Html5Qrcode("reader");
    let config={
        fps: 30,
        qrbox: {width: 280, height: 280},
        aspectRatio: 1.0,
        disableFlip: false,
        experimentalFeatures: {useBarCodeDetectorIfSupported: true},
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    };
    html5QrCode.start(
        {facingMode: "environment"},
        config,
        onScanSuccess,
        (err)=>{ /* ignore scan errors */ }
    ).catch(err=>{
        document.getElementById('status').innerHTML="❌ Camera Error: "+err+" - Chrome me Allow karo";
    });
}

// Auto start
startScanner();

function activate(){
    let q=qr.value.toUpperCase().trim(),v=vehicle.value.trim(),m=mobile.value.replace(/\D/g,'').slice(-10),w=work.value.trim(),wa=wano.value.replace(/\D/g,'').slice(-10);
    if(!q||!v||!m||!w||!wa){alert('Sab bharo bhai');return;}
    let link=`https://wa.me/91${wa}?text=Namaste! Gaadi ${encodeURIComponent(v)} (${q}) parking issue. Owner: ${m} (${w}) - RAFTA`;
    db[q]={vehicle:v,mobile:m,work:w,whatsapp:wa,waLink:link,time:Date.now()};
    localStorage.setItem('rafta_final',JSON.stringify(db));
    localStorage.setItem('rafta',JSON.stringify(db));
    res.innerHTML=`<div style="background:#d1fae5;padding:12px;border-radius:12px;margin-top:12px;text-align:center"><b>✅ ${q} ACTIVE!</b><br><a href="index.html?qr=${q}" target="_blank" style="background:#000;color:#FFC600;padding:8px 14px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:6px">TEST SCAN</a></div>`;
    // Reset for next scan
    lastScan="";
    document.getElementById('status').innerHTML="📷 Next QR lao...";
    document.getElementById('status').style.background="#000";
}
</script>
</body></html>
