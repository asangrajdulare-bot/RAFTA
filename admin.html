<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFTA QR ADMIN - Dynamic QR Activator</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#101010;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:430px;background:#f5f5f7;min-height:100vh;position:relative;border-radius:36px;overflow:hidden;box-shadow:0 0 0 10px #1a1a1a}
.top-section{background:#0a0a0a;color:#f0c419;padding:16px 18px 38px 18px;border-radius:0 0 26px 26px}
.top-row{display:flex;align-items:center;gap:12px}
.logo-top{width:48px;height:48px;border-radius:12px;background:#000;object-fit:cover}
.top-title{font-size:20px;font-weight:900;color:#f0c419;line-height:1.2}
.top-sub{font-size:11px;color:#a68e2e;margin-top:5px;font-weight:600}
.stats-row{display:flex;gap:10px;margin-top:16px}
.stat-card{background:#fff8dc;flex:1;border-radius:14px;padding:10px 12px}
.stat-label{font-size:10px;color:#666;font-weight:700}
.stat-value{font-size:16px;font-weight:900;color:#111;margin-top:2px}
.main-content{padding:0 14px 90px 14px;margin-top:-20px;position:relative;z-index:2}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:17px;font-weight:800}
.badge-new{background:#f0c419;color:#000;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}
.label{font-size:10px;font-weight:800;color:#222;margin-bottom:5px;margin-top:10px;display:block}
.input-wrap{position:relative}
.input{width:100%;padding:11px 12px 11px 36px;border:1.5px solid #e5e7eb;border-radius:11px;font-size:13px;font-weight:600;background:#fafafa;outline:none}
.input:focus{border-color:#f0c419;background:#fff}
.input-plain{padding-left:12px}
.input-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;background:#f0c419;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px}
.btn-activate{width:100%;margin-top:14px;background:#f0c419;color:#000;border:none;padding:13px;border-radius:11px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #d4a90e}
.qr-item{background:#fff;border-radius:13px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.qr-left{display:flex;align-items:center;gap:9px}
.check{background:#0ab84a;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.qr-id{font-size:13px;font-weight:800}
.qr-meta{font-size:9px;color:#555;font-weight:600;margin-top:2px;line-height:1.3}
.qr-time{background:#e8f8e0;color:#4a7a3a;font-size:8px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:#0a0a0a;border-radius:18px 18px 0 0;display:flex;justify-content:space-around;padding:10px 0 16px 0}
.nav-item{color:#777;text-align:center;font-size:9px;font-weight:600;cursor:pointer;flex:1}
.nav-item.active{color:#f0c419}
.nav-ico{font-size:18px;display:block;margin-bottom:2px}
.page{display:none}.page.active{display:block}
#reader{display:none;margin-top:8px;border-radius:12px;overflow:hidden}
#loginPage{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:100;padding:22px}
.login-card{background:#fff;width:100%;max-width:360px;border-radius:20px;padding:22px;border:3px solid #f0c419;text-align:center}
.inp{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:9px;font-size:13px}
.btn-black{width:100%;padding:11px;background:#0a0a0a;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modalBox{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:340px}
</style>
</head>
<body>
<div id="loginPage"><div class="login-card">
